[project]
name = "battery"
version = "0.1.0"
description = "Battery schedule and AEMO bid optimiser behind gridviz-solve"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.15.1",
    "pyomo>=6.10.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "pytest>=9.1.1",
]
