AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: gridviz NEM data (S3 data bucket, scheduled NEMWeb ingest Lambda, nightly plot rebuild Lambda and on-demand battery solve Lambda)

Parameters:
  DistributionId:
    Type: String
    Default: E2JVBFPXUKXCQW
    Description: CloudFront distribution (gridviz-site) allowed to read data/* and call the solve function URL
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DataBucket.Arn}/data/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gridviz-ingest
      RetentionInDays: 14

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gridviz-ingest
      CodeUri: ../ingest/dist
      Handler: handler.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 240
      Events:
        Every5Minutes:
          Type: ScheduleV2
          Properties:
            Name: gridviz-ingest
            # AEMO publishes each DispatchIS file a few seconds after the 5-minute boundary
            ScheduleExpression: cron(1/5 * * * ? *)
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gridviz-ingest-errors
      AlarmDescription: >-
        gridviz-ingest failed or didn't run in the last 15 minutes. AemoFormatError in /aws/lambda/gridviz-ingest
        means AEMO changed the DispatchIS format; see ingest/src/schema.ts.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Lambda reports Errors=0 on every invocation, so no data means the schedule stopped
      TreatMissingData: breaching

  RebuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gridviz-rebuild
      RetentionInDays: 14

  RebuildFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gridviz-rebuild
      CodeUri: ../ingest/dist
      Handler: rebuild-handler.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogGroup: !Ref RebuildLogGroup
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 3600
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            Name: gridviz-rebuild
            # 00:30 market time: after ingest has written the interval ending 00:00, the last of yesterday
            ScheduleExpression: cron(30 0 * * ? *)
            ScheduleExpressionTimezone: Australia/Brisbane
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0

  RebuildErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gridviz-rebuild-errors
      AlarmDescription: >-
        gridviz-rebuild failed in the last day, so data/plots/ wasn't updated. See /aws/lambda/gridviz-rebuild.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RebuildFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SolveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gridviz-solve
      RetentionInDays: 14

  # On-demand battery solve for the /solve page; only CloudFront (/api/*) may call its URL
  SolveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gridviz-solve
      CodeUri: ../engine/dist
      Handler: battery.handler.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 1024
      # The solver gives up at 50 s (engine/src/battery/model.py); CloudFront waits at most 60 s
      Timeout: 60
      # Caps the cost of a public endpoint being flooded
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        LogGroup: !Ref SolveLogGroup
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${DataBucket.Arn}/data/days/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
      FunctionUrlConfig:
        AuthType: AWS_IAM

  # CloudFront's docs grant both actions for a function URL behind origin access control
  SolveUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SolveFunction
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

  SolveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SolveFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

  SolveErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gridviz-solve-errors
      AlarmDescription: >-
        gridviz-solve crashed or timed out in the last day (bad requests and solver failures are
        answered with 4xx/5xx and don't count). See /aws/lambda/gridviz-solve.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SolveFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
    Export:
      Name: gridviz-data-bucket-name
  DataBucketDomain:
    Value: !GetAtt DataBucket.RegionalDomainName
    Export:
      Name: gridviz-data-bucket-domain
  IngestFunctionName:
    Value: !Ref IngestFunction
  RebuildFunctionName:
    Value: !Ref RebuildFunction
  SolveFunctionName:
    Value: !Ref SolveFunction
  SolveUrlDomain:
    # FunctionUrl is https://<id>.lambda-url.<region>.on.aws/; CloudFront wants the host only
    Value: !Select [2, !Split ['/', !GetAtt SolveFunctionUrl.FunctionUrl]]
    Export:
      Name: gridviz-solve-url-domain
