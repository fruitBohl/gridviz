name: gridviz

services:
  app:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    env_file:
      - ../../.env
    volumes:
      - ../..:/home/bun/workspace:cached
      - ${HOME}/.aws:/home/bun/.aws
      # Commit identity (user.name/email); read-only so container tools can't rewrite it
      - ${HOME}/.gitconfig:/home/bun/.gitconfig:ro
      - claude-home:/home/bun/.claude
    # Zed's devcontainer image resets USER to root; pin bun so plain `docker compose exec` matches Zed.
    user: bun
    command: sleep infinity
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: gridviz
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gridviz']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  claude-home: